<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07070d">
<title>Anesthios – prototipo de interfaz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070d;--txt:#CECBF6;--dim:#7d78b8;--tenue:#4a4590;--line:#2c2766;--acc:#7a6ff0;--acc2:#5aa0f0;
    --glass:rgba(14,12,36,.78);--titulo:'Rajdhani',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  /* ---------- Barra superior: nombre de la app ---------- */
  .barra-sup{display:flex;align-items:center;gap:12px;padding:12px 16px 8px;position:relative}
  .marca{font:600 20px var(--titulo);letter-spacing:.42em;color:#e4e1ff;text-shadow:0 0 14px rgba(122,111,240,.55)}
  .marca small{display:block;font:500 9px var(--mono);letter-spacing:.25em;color:var(--tenue);margin-top:1px}
  .barra-sup .esp{flex:1}
  .chip-estado{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:7px;white-space:nowrap;
    padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(20,18,50,.5)}
  .chip-estado i{width:7px;height:7px;border-radius:50%;background:#555;box-shadow:0 0 0 0 transparent;transition:background .4s,box-shadow .4s}
  .chip-estado.on i{background:#8f86ff;box-shadow:0 0 8px 2px rgba(143,134,255,.7)}
  .chip-estado.ok i{background:#3ddc84;box-shadow:0 0 8px 2px rgba(61,220,132,.7)}
  .chip-estado.err i{background:#ff4d5e;box-shadow:0 0 8px 2px rgba(255,77,94,.7)}
  .boton-menu{width:38px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--txt);font-size:16px}
  /* regla con marcas bajo la barra */
  .regla{height:9px;margin:0 16px;background:
      repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12px) bottom/100% 4px no-repeat,
      repeating-linear-gradient(90deg,var(--tenue) 0 1px,transparent 1px 60px) bottom/100% 9px no-repeat,
      linear-gradient(var(--line),var(--line)) bottom/100% 1px no-repeat;opacity:.8}

  /* ---------- Zona central ---------- */
  #zona{flex:1;position:relative;min-height:0;overflow:hidden}
  .fondo{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at 50% 52%,rgba(90,80,220,.16),transparent 55%),
      radial-gradient(rgba(122,111,240,.13) 1px,transparent 1.4px) 0 0/22px 22px;
    -webkit-mask:radial-gradient(circle at 50% 52%,#000 30%,transparent 78%);mask:radial-gradient(circle at 50% 52%,#000 30%,transparent 78%)}
  #stage{position:absolute;inset:0;touch-action:none}
  .escena{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* Retícula HUD alrededor de Agios */
  .reticula{position:absolute;left:50%;top:52%;width:min(92vw,92vh,640px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
  .reticula .aro{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(122,111,240,.14)}
  .reticula .aro.b{inset:4%;border:1px dashed rgba(122,111,240,.18);animation:girar 90s linear infinite}
  .reticula .aro.c{inset:-3%;border:none;background:conic-gradient(from 0deg,rgba(122,111,240,.35) 0 1deg,transparent 1deg 30deg);
    -webkit-mask:radial-gradient(circle,transparent 69.4%,#000 69.6%,#000 70.6%,transparent 70.8%);mask:radial-gradient(circle,transparent 69.4%,#000 69.6%,#000 70.6%,transparent 70.8%);animation:girar 160s linear infinite reverse}
  .reticula .eje{position:absolute;background:linear-gradient(90deg,transparent,rgba(122,111,240,.25) 12%,transparent 34%,transparent 66%,rgba(122,111,240,.25) 88%,transparent)}
  .reticula .eje.h{left:-6%;right:-6%;top:50%;height:1px}
  .reticula .eje.v{top:-6%;bottom:-6%;left:50%;width:1px;background:linear-gradient(180deg,transparent,rgba(122,111,240,.25) 12%,transparent 34%,transparent 66%,rgba(122,111,240,.25) 88%,transparent)}
  .reticula .grado{position:absolute;font:9px var(--mono);color:var(--tenue);letter-spacing:.1em}
  @keyframes girar{to{transform:rotate(360deg)}}

  /* Esquinas del marco */
  .esquina{position:absolute;width:26px;height:26px;border:1.5px solid rgba(122,111,240,.55);pointer-events:none}
  .esquina.a{top:10px;left:10px;border-right:none;border-bottom:none}
  .esquina.b{top:10px;right:10px;border-left:none;border-bottom:none}
  .esquina.c{bottom:10px;left:10px;border-right:none;border-top:none}
  .esquina.d{bottom:10px;right:10px;border-left:none;border-top:none}

  /* Nombre del asistente (colección) */
  .titulo-col{position:absolute;top:22px;left:0;right:0;text-align:center;pointer-events:none}
  .titulo-col h2{margin:0;font:600 34px var(--titulo);letter-spacing:.6em;padding-left:.6em;color:#ece9ff;
    text-shadow:0 0 18px rgba(122,111,240,.7),0 0 2px #fff;transition:color .6s,text-shadow .6s}
  .titulo-col.apagado h2{color:#9a98b0;text-shadow:0 0 8px rgba(160,160,190,.25)}
  .titulo-col .sub{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px;font:500 10px var(--mono);letter-spacing:.28em;color:var(--dim)}
  .titulo-col .sub::before,.titulo-col .sub::after{content:'';width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--acc))}
  .titulo-col .sub::after{transform:scaleX(-1)}

  /* Paneles de lectura (datos) */
  .panel-dato{position:absolute;bottom:22px;width:clamp(130px,30vw,190px);padding:10px 12px;font:10.5px var(--mono);color:var(--dim);
    border:1px solid var(--line);background:linear-gradient(180deg,rgba(18,16,46,.55),rgba(10,9,26,.35));border-radius:4px;pointer-events:none;
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
  .panel-dato.izq{left:20px}.panel-dato.der{right:20px;clip-path:polygon(0 0,100% 0,100% 100%,12px 100%,0 calc(100% - 12px))}
  .panel-dato h3{margin:0 0 7px;font:600 11px var(--titulo);letter-spacing:.3em;color:var(--txt)}
  .panel-dato .f{display:flex;justify-content:space-between;gap:8px;line-height:1.75}
  .panel-dato .f b{font-weight:500;color:var(--txt)}
  .abiertas{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 3px;min-height:18px;color:var(--tenue)}
  .abiertas span{font:500 10px var(--mono);color:#d9d5ff;padding:1px 5px;border:1px solid var(--line);border-radius:3px;background:rgba(122,111,240,.12)}
  .barras{display:flex;align-items:flex-end;gap:3px;height:22px;margin-top:6px}
  .barras span{flex:1;background:linear-gradient(180deg,#a49cff,#5a50c8);border-radius:1px;height:10%;transition:height .12s}

  /* ---------- Ventana "Subir archivo" ---------- */
  #subir{position:absolute;width:min(78vw,300px);padding:18px;border-radius:6px;background:var(--glass);border:1px solid var(--acc);
    box-shadow:0 0 40px rgba(122,111,240,.35);text-align:center;transform:translate(-50%,-50%) scale(0);opacity:0;
    transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .35s;pointer-events:none;backdrop-filter:blur(6px);z-index:3}
  #subir.abierta{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  #subir h4{font:600 17px var(--titulo);letter-spacing:.2em;margin:0 0 6px}
  #subir p{font-size:12px;color:var(--dim);margin:0 0 14px}

  /* ---------- Ventanas de resultados ---------- */
  #resultados{position:absolute;inset:0;pointer-events:none;z-index:2}
  .tarjeta{pointer-events:auto;position:absolute;width:min(84%,360px);background:var(--glass);border:1px solid rgba(122,111,240,.45);border-radius:4px;
    box-shadow:0 0 26px rgba(122,111,240,.22);backdrop-filter:blur(6px);transform:scale(.02);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.3,1.15),opacity .3s}
  .tarjeta.visible{transform:scale(1);opacity:1}
  .tarjeta.arrastrando{transition:none;box-shadow:0 0 40px rgba(122,111,240,.45);border-color:var(--acc)}
  .tarjeta .agarre{font:12px var(--mono);color:var(--tenue);letter-spacing:-2px;margin-right:2px}
  .tarjeta.cerrando{transform:scale(.6);opacity:0;transition:transform .3s ease-in,opacity .25s}
  .tarjeta::before,.tarjeta::after{content:'';position:absolute;width:12px;height:12px;border:1.5px solid var(--acc)}
  .tarjeta::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
  .tarjeta::after{bottom:-1px;right:-1px;border-left:none;border-top:none}
  .tarjeta .cab{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;gap:8px;padding:8px 8px 7px 12px;border-bottom:1px solid var(--line);background:rgba(122,111,240,.07)}
  .tarjeta .ref{font:600 12.5px var(--mono);color:#c2bbff}
  .tarjeta .tipo{flex:1;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .tarjeta .x{width:30px;height:28px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--dim);font-size:14px;line-height:1;padding:0}
  .tarjeta .x:active{background:#2a1430;color:#ff8d98;border-color:#6b2a40}
  .tarjeta p{font-size:13.5px;line-height:1.5;margin:0;padding:10px 12px 4px}
  .tarjeta mark{background:rgba(122,111,240,.3);color:#fff;border-radius:2px;padding:0 2px}
  .tarjeta .pie{display:flex;justify-content:flex-end;padding:6px 10px 10px}
  #cerrarTodas{display:none;color:#ffb3bb!important;border-color:#6b2a40!important}
  #cerrarTodas.ver{display:block}
  .chispa{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#e9e6ff;z-index:3;
    box-shadow:0 0 10px 4px rgba(150,130,255,.9),0 0 24px 8px rgba(110,90,240,.5);pointer-events:none}

  /* ---------- Consola inferior ---------- */
  .consola{padding:8px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(180deg,#0a0a16,#08080f)}
  .sugerencias{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .sugerencias button{flex:none;font:500 11px var(--mono);letter-spacing:.06em;padding:6px 10px;border-radius:999px;color:var(--dim);border-color:var(--line)}
  .entrada{display:flex;gap:8px}
  .campo{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#0e0c22;border:1px solid #3a3480;border-radius:8px;padding:0 12px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
  .campo:focus-within{border-color:var(--acc);box-shadow:inset 0 0 18px rgba(122,111,240,.18)}
  .campo span{font:600 16px var(--mono);color:var(--acc)}
  .campo input{flex:1;min-width:0;background:transparent;border:none;color:var(--txt);padding:12px 0;font-size:15px;outline:none}
  .campo input:disabled{opacity:.45}
  button{background:transparent;color:var(--txt);border:1px solid #534AB7;border-radius:8px;padding:9px 12px;font-size:14px;cursor:pointer}
  button:active{background:#17143a}
  button:disabled{opacity:.4}
  .prim{background:#1d1950;border-color:var(--acc)}
  .icono{width:48px;flex:none;font-size:18px;padding:0}

  /* Lector */
  #lector{position:fixed;inset:0;background:rgba(7,7,13,.95);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 18px 18px;z-index:9}
  #lector.abierto{display:flex}
  #lector .cab{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
  #lector article{overflow-y:auto;padding-top:12px;font-size:15.5px;line-height:1.65}

  @media (max-width:520px){.marca{font-size:17px;letter-spacing:.3em}.marca small{letter-spacing:.15em}.chip-estado{font-size:10px;padding:5px 8px}.panel-dato{bottom:14px;width:44%;font-size:9.5px}.titulo-col h2{font-size:28px}}
</style>
</head>
<body>

<header class="barra-sup">
  <div class="marca">ANESTHIOS<small>ASISTENTES GONZALEANOS</small></div>
  <div class="esp"></div>
  <div class="chip-estado" id="chip"><i></i><span id="estado">apagado</span></div>
  <button class="boton-menu" type="button" title="Menú">☰</button>
</header>
<div class="regla"></div>

<div id="zona">
  <div class="fondo"></div>
  <div class="reticula">
    <div class="aro"></div><div class="aro b"></div><div class="aro c"></div>
    <div class="eje h"></div><div class="eje v"></div>
    <span class="grado" style="left:50%;top:-5%;transform:translateX(-50%)">000</span>
    <span class="grado" style="right:-7%;top:50%;transform:translateY(-50%)">090</span>
    <span class="grado" style="left:50%;bottom:-5%;transform:translateX(-50%)">180</span>
    <span class="grado" style="left:-7%;top:50%;transform:translateY(-50%)">270</span>
  </div>
  <div id="stage"></div>
  <div class="esquina a"></div><div class="esquina b"></div><div class="esquina c"></div><div class="esquina d"></div>

  <div class="titulo-col apagado" id="tituloCol">
    <h2>AGIOS</h2>
    <div class="sub">LECTURAS Y EVANGELIOS</div>
  </div>

  <div class="panel-dato izq">
    <h3>COLECCIÓN</h3>
    <div class="f"><span>Conjuntos</span><b>371</b></div>
    <div class="f"><span>Abiertas</span><b id="dAbiertas">0</b></div>
    <div class="abiertas" id="dLista">—</div>
    <div class="f"><span>Índice</span><b id="dIndice">● listo</b></div>
    <div class="f"><span>Modo</span><b>local</b></div>
  </div>
  <div class="panel-dato der">
    <h3>SISTEMA</h3>
    <div class="f"><span>Energía</span><b id="dEnergia">0%</b></div>
    <div class="f"><span>Documento</span><b id="dDoc">—</b></div>
    <div class="f"><span>Hora</span><b id="dHora">--:--</b></div>
    <div class="barras" id="barras"></div>
  </div>

  <div id="resultados"></div>
  <div id="subir">
    <h4>SUBIR ARCHIVO</h4>
    <p>Elige el .docx de Lecturas y Evangelios Gonzaleanos</p>
    <div style="display:flex;gap:8px">
      <button id="cancelarSubir" type="button" style="flex:1">Cancelar</button>
      <button id="elegir" class="prim" type="button" style="flex:1.4">Elegir archivo</button>
    </div>
    <input id="archivo" type="file" accept=".docx" hidden>
  </div>
</div>

<form class="consola" id="form">
  <div class="sugerencias">
    <button id="cerrarTodas" type="button">✕ Cerrar todas</button>
    <button type="button" data-q="Evang. Gonz. 145">Evang. Gonz. 145</button>
    <button type="button" data-q="salmo 87">salmo 87</button>
    <button type="button" data-q="la misericordia del Padre">la misericordia del Padre</button>
    <button type="button" data-a="indice">☰ Índice</button>
  </div>
  <div class="entrada">
    <button id="btnSubir" class="icono" type="button" title="Subir archivo" disabled>📎</button>
    <label class="campo"><span>›</span><input id="consulta" placeholder="Toca a Agios para encenderlo" autocomplete="off" disabled></label>
    <button id="btnBuscar" class="icono prim" type="submit" title="Buscar" disabled>➤</button>
  </div>
</form>

<div id="lector">
  <div class="cab"><span id="lectorTitulo" style="font:600 14px var(--mono);color:#c2bbff"></span><button id="cerrarLector" type="button">Cerrar</button></div>
  <article id="lectorTexto"></article>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import escenaAgios from './agios-escena.js';

const S={energy:0,mult:1,apertura:0,temblor:0,destello:{color:new THREE.Color(),k:0,h:0},particles:90,rot:0,rotVel:0,tilt:0,zoom:1,T:0};
const meta={energy:0,mult:1,apertura:0,temblor:0};
const $=id=>document.getElementById(id);
const stage=$('stage'),zona=$('zona');
const escena=escenaAgios.crear(stage,S);
function layout(){const r=stage.getBoundingClientRect();if(r.width&&r.height)escena.redimensionar(r.width,r.height);}
new ResizeObserver(layout).observe(stage);layout();

/* ---------- Estados ---------- */
let modo='apagado';
const etiquetas={apagado:'apagado',activo:'activo',esperando:'esperando archivo',procesando:'procesando',exito:'archivo listo',error:'no válido',buscando:'buscando'};
function poner(m,texto){
  modo=m;$('estado').textContent=texto||etiquetas[m];
  const on=m!=='apagado';
  $('chip').className='chip-estado'+(m==='exito'?' ok':m==='error'?' err':on?' on':'');
  $('tituloCol').classList.toggle('apagado',!on);
  meta.energy=on?1:0;meta.mult={procesando:3,buscando:2}[m]||1;meta.apertura=m==='esperando'?1:0;meta.temblor=m==='procesando'?1:0;
  clearTimeout(poner.t);
  if(m==='esperando')poner.t=setTimeout(()=>$('subir').classList.add('abierta'),380);else $('subir').classList.remove('abierta');
  const libre=m==='activo';
  for(const id of ['consulta','btnSubir','btnBuscar'])$(id).disabled=!libre;
  document.querySelectorAll('.sugerencias button:not(#cerrarTodas)').forEach(b=>b.disabled=!libre);
  $('consulta').placeholder=on?'Pídele a Agios una lectura, un evangelio o una idea…':'Toca a Agios para encenderlo';
}
const destellar=hex=>{S.destello.color.set(hex);S.destello.k=1;S.destello.h=900;};
function alternar(){if(modo==='apagado')poner('activo');else if(modo==='activo'){cerrarTodas();poner('apagado');}}

/* ---------- Subir (simulado) ---------- */
function colocarVentana(){const c=escena.proyectar(new THREE.Vector3());const v=$('subir');v.style.left=c.x+'px';v.style.top=(c.y+Math.min(170,zona.clientHeight*.27))+'px';}
$('btnSubir').onclick=()=>{colocarVentana();poner('esperando');};
$('cancelarSubir').onclick=()=>poner('activo');
$('elegir').onclick=()=>$('archivo').click();
$('archivo').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  poner('procesando');setTimeout(()=>{const ok=/\.docx$/i.test(f.name);destellar(ok?'#3ddc84':'#ff4d5e');poner(ok?'exito':'error');if(ok){docActualizado=new Date();pintarDoc();}setTimeout(()=>poner('activo'),1800);},3600);};

/* ---------- Buscar (simulado) y ventanas con ✕ ---------- */
const TEXTO='Texto de ejemplo: en la app aparece aquí el pasaje real con la parte que coincide <mark>resaltada</mark>.';
function buscar(q){
  if(!q||modo!=='activo')return;poner('buscando');
  setTimeout(()=>{
    const n=(q.match(/\d+/)||[])[0];
    const res=n?[{ref:`Lect. Gonz. ${n}`,tipo:'Santa Lectura'},{ref:`Evang. Gonz. ${n}`,tipo:'Santo Evangelio'}]
               :[{ref:'Evang. Gonz. 12',tipo:'Santo Evangelio'},{ref:'Salmo Gonz. 87',tipo:'Santo Salmo'},{ref:'Lect. Gonz. 140',tipo:'Santa Lectura'}];
    poner('activo',res.length+' resultados');mostrar(res);
  },1700);
}
$('form').onsubmit=e=>{e.preventDefault();buscar($('consulta').value.trim());};
document.querySelectorAll('.sugerencias button[data-q]').forEach(b=>b.onclick=()=>{$('consulta').value=b.dataset.q;buscar(b.dataset.q);});

/* Panel COLECCIÓN: cuántas piezas hay abiertas y cuáles */
function actualizarAbiertas(){
  const refs=[...$('resultados').querySelectorAll('.tarjeta:not(.cerrando)')].map(t=>t.dataset.corta);
  $('dAbiertas').textContent=refs.length;
  const l=$('dLista');l.innerHTML='';
  if(!refs.length){l.textContent='—';return;}
  refs.slice(0,8).forEach(r=>{const s=document.createElement('span');s.textContent=r;l.append(s);});
  if(refs.length>8){const s=document.createElement('span');s.textContent='+'+(refs.length-8);l.append(s);}
}
function actualizarCerrarTodas(){actualizarAbiertas();$('cerrarTodas').classList.toggle('ver',$('resultados').querySelectorAll('.tarjeta:not(.cerrando)').length>1);}
function cerrarTarjeta(t){t.classList.add('cerrando');setTimeout(()=>{t.remove();actualizarCerrarTodas();},300);actualizarCerrarTodas();}
function cerrarTodas(){$('resultados').querySelectorAll('.tarjeta').forEach(cerrarTarjeta);}
$('cerrarTodas').onclick=cerrarTodas;

let zSig=10;
/* Busca un hueco libre para una ventana nueva sin tapar las que ya están */
function hueco(w,h){
  const W=zona.clientWidth,H=zona.clientHeight,top=92,abajo=H-12,m=12;
  const otras=[...$('resultados').querySelectorAll('.tarjeta:not(.cerrando)')].map(t=>({x:t.offsetLeft,y:t.offsetTop,w:t.offsetWidth,h:t.offsetHeight}));
  const choca=(x,y)=>otras.some(o=>x<o.x+o.w-20&&x+w-20>o.x&&y<o.y+o.h-20&&y+h-20>o.y);
  const xs=[m,W-w-m,(W-w)/2];
  for(let y=top;y+h<=abajo;y+=24)for(const x of xs)if(!choca(x,y))return{x,y};
  const n=otras.length;return{x:m+(n*26)%Math.max(1,W-w-2*m),y:top+(n*30)%Math.max(1,abajo-h-top)};   // en cascada si ya no cabe
}
/* Arrastrar una ventana desde su encabezado */
function hacerMovible(t){
  const cab=t.querySelector('.cab');let ini=null;
  t.addEventListener('pointerdown',()=>{t.style.zIndex=++zSig;});
  cab.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    cab.setPointerCapture(e.pointerId);t.classList.add('arrastrando');
    ini={px:e.clientX,py:e.clientY,x:t.offsetLeft,y:t.offsetTop};
  });
  cab.addEventListener('pointermove',e=>{
    if(!ini)return;
    const W=zona.clientWidth,H=zona.clientHeight;
    const x=Math.max(-t.offsetWidth+60,Math.min(W-60,ini.x+e.clientX-ini.px));
    const y=Math.max(0,Math.min(H-40,ini.y+e.clientY-ini.py));
    t.style.left=x+'px';t.style.top=y+'px';
  });
  const soltar=()=>{ini=null;t.classList.remove('arrastrando');};
  cab.addEventListener('pointerup',soltar);cab.addEventListener('pointercancel',soltar);
}
function mostrar(lista){
  const cont=$('resultados');
  lista.forEach((r,i)=>{
    const t=document.createElement('div');t.className='tarjeta';t.style.zIndex=++zSig;
    t.dataset.corta=({'Santa Lectura':'L','Santo Salmo':'S','Santo Evangelio':'E'}[r.tipo]||'?')+'·'+(r.ref.match(/\d+/)||[''])[0];
    t.style.width=Math.min(zona.clientWidth*0.84,360)+'px';
    t.innerHTML=`<div class="cab"><span class="agarre">⋮⋮</span><span class="ref">${r.ref}</span><span class="tipo">${r.tipo}</span><button class="x" type="button" title="Cerrar">✕</button></div>
      <p>${TEXTO}</p><div class="pie"><button type="button">Ver completo</button></div>`;
    t.querySelector('.x').onclick=()=>cerrarTarjeta(t);
    t.querySelector('.pie button').onclick=()=>{$('lectorTitulo').textContent=r.ref+' · '+r.tipo;$('lectorTexto').innerHTML=(TEXTO+' ').repeat(6);$('lector').classList.add('abierto');};
    t.style.visibility='hidden';cont.append(t);
    const p=hueco(t.offsetWidth,t.offsetHeight);t.style.left=p.x+'px';t.style.top=p.y+'px';t.style.visibility='';
    hacerMovible(t);
    setTimeout(()=>{
      const o=escena.puntoDeAnillo(i,S.T*0.001+i*2.1);
      const dx=t.offsetLeft+t.offsetWidth/2,dy=t.offsetTop+t.offsetHeight/2;
      const ch=document.createElement('div');ch.className='chispa';zona.append(ch);
      ch.animate([{left:o.x+'px',top:o.y+'px',transform:'scale(1)'},
                  {left:(o.x+dx)/2+(i%2?40:-40)+'px',top:(o.y+dy)/2-30+'px',transform:'scale(1.4)',offset:.55},
                  {left:dx+'px',top:dy+'px',transform:'scale(2.2)'}],{duration:700,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'})
        .onfinish=()=>{ch.remove();t.classList.add('visible');actualizarCerrarTodas();};
    },i*260);
  });
}
$('cerrarLector').onclick=()=>$('lector').classList.remove('abierto');

/* ---------- Gestos ---------- */
const ptrs=new Map();let down=null,pinch0=null;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)down={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:S.zoom};if(down)down.moved=true;}});
stage.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2&&pinch0){const [a,b]=[...ptrs.values()];S.zoom=Math.max(.5,Math.min(2.5,pinch0.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d));return;}
  if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)down.moved=true;
  if(down&&down.moved){S.rot+=dx*.008;S.rotVel=dx*.008;S.tilt=Math.max(-.3,Math.min(.7,S.tilt+dy*.004));}});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;if(ptrs.size===0&&down){if(!down.moved&&performance.now()-down.t<300)alternar();down=null;}}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();S.zoom=Math.max(.5,Math.min(2.5,S.zoom*Math.exp(-e.deltaY*.001)));},{passive:false});

/* ---------- Paneles de datos en vivo ---------- */
const barras=$('barras');for(let i=0;i<14;i++)barras.append(document.createElement('span'));
/* Panel SISTEMA: cuándo se actualizó el documento por última vez */
let docActualizado=new Date(Date.now()-2*864e5);          // (prototipo: ejemplo de hace 2 días)
function hace(d){
  const ahora=new Date(),min=Math.round((ahora-d)/6e4);
  const mismoDia=(a,b)=>a.toDateString()===b.toDateString();
  if(min<1)return 'ahora';
  if(min<60)return 'hace '+min+' min';
  if(mismoDia(d,ahora))return 'hoy '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  const ayer=new Date(ahora);ayer.setDate(ahora.getDate()-1);
  if(mismoDia(d,ayer))return 'ayer';
  const dias=Math.floor((ahora-d)/864e5);
  if(dias<30)return 'hace '+dias+' días';
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
}
const pintarDoc=()=>{$('dDoc').textContent=hace(docActualizado);};
const hora=()=>{pintarDoc();const d=new Date();$('dHora').textContent=d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});};hora();setInterval(hora,20000);

/* ---------- Bucle ---------- */
let last=performance.now(),acum=0;
const suave=(a,b,dT,k)=>a+(b-a)*(1-Math.pow(k,dT/16.7));
function loop(t){
  const dT=Math.min(50,Math.max(0,t-last));last=t;
  S.energy=suave(S.energy,meta.energy,dT,.95);S.mult=suave(S.mult,meta.mult,dT,.93);
  S.apertura=suave(S.apertura,meta.apertura,dT,.9);S.temblor=suave(S.temblor,meta.temblor,dT,.9);
  S.destello.h=Math.max(0,S.destello.h-dT);if(S.destello.h<=0)S.destello.k=Math.max(0,S.destello.k-dT/900);
  S.T+=dT*.85*S.mult*(.15+.85*S.energy);
  if(!down){S.rot+=S.rotVel;S.rotVel*=Math.pow(.94,dT/16.7);}
  if(modo==='esperando')colocarVentana();
  acum+=dT;if(acum>90){acum=0;
    $('dEnergia').textContent=Math.round(S.energy*100)+'%';
    [...barras.children].forEach((b,i)=>b.style.height=(8+S.energy*(25+60*Math.abs(Math.sin(S.T*.003+i*.7))*(.6+.4*Math.random()))*(S.mult/1.5+.33))+'%');
  }
  escena.dibujar(t,dT);requestAnimationFrame(loop);
}
poner('apagado');requestAnimationFrame(loop);
</script>
