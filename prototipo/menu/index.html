<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Anesthios – menú nebulosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* ---------- Dos mundos, un mismo esqueleto ---------- */
  .tema-agios{--txt:#CECBF6;--dim:#7d78b8;--acento:#7a6ff0;--linea:#2c2766;--claro:#e4e1ff;--chip:rgba(20,18,50,.5)}
  .tema-kyrien{--txt:#f1e4c6;--dim:#c7ad7c;--acento:#d9b26a;--linea:rgba(217,178,106,.45);--claro:#f3dca6;--chip:rgba(40,28,18,.45)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#07070d;color:var(--txt);font-family:system-ui,sans-serif;overscroll-behavior:none}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition:color 1.2s}
  /* Fondos de cada mundo, que se funden entre sí */
  .mundo{position:fixed;inset:0;pointer-events:none;transition:opacity 2.4s ease}
  .mundo.agios{background:radial-gradient(circle at 50% 52%,rgba(90,80,220,.18),transparent 55%),#07070d}
  .mundo.agios::after{content:'';position:absolute;inset:0;background:radial-gradient(rgba(122,111,240,.13) 1px,transparent 1.4px) 0 0/22px 22px;
    -webkit-mask:radial-gradient(circle at 50% 52%,#000 30%,transparent 78%);mask:radial-gradient(circle at 50% 52%,#000 30%,transparent 78%)}
  .mundo.kyrien{background:radial-gradient(ellipse at 50% 48%,#5a4228 0%,#3d2d1f 32%,#2a2018 62%,#1d1612 100%)}
  .mundo.kyrien::after{content:'';position:absolute;inset:0;opacity:.6;background-image:radial-gradient(1px 1px at 12% 18%,#f6e3b4,transparent),radial-gradient(1px 1px at 78% 12%,#f6e3b4,transparent),
      radial-gradient(1.5px 1.5px at 33% 72%,#f6e3b4,transparent),radial-gradient(1px 1px at 88% 64%,#f6e3b4,transparent),radial-gradient(1px 1px at 52% 30%,#f6e3b4,transparent),
      radial-gradient(1.5px 1.5px at 18% 88%,#f6e3b4,transparent),radial-gradient(1px 1px at 66% 86%,#f6e3b4,transparent),radial-gradient(1px 1px at 92% 34%,#f6e3b4,transparent)}
  .tema-agios .mundo.kyrien,.tema-kyrien .mundo.agios{opacity:0}

  header{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 16px 6px}
  .marca{position:relative;height:40px;flex:1}
  .marca .v{position:absolute;left:0;top:0;transition:opacity 1.2s}
  .marca .agios{font:600 20px 'Rajdhani',sans-serif;letter-spacing:.42em;color:#e4e1ff;text-shadow:0 0 14px rgba(122,111,240,.55)}
  .marca .agios small{display:block;font:500 9px 'JetBrains Mono',monospace;letter-spacing:.25em;color:#4a4590}
  .marca .kyrien{font:600 19px 'Cinzel',serif;letter-spacing:.32em;color:#f3dca6;text-shadow:0 0 12px rgba(243,220,166,.35)}
  .marca .kyrien small{display:block;font:italic 500 13px 'Cormorant Garamond',serif;letter-spacing:.08em;color:#c7ad7c}
  .tema-agios .marca .kyrien,.tema-kyrien .marca .agios{opacity:0}
  .chip{white-space:nowrap;display:flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--linea);border-radius:999px;background:var(--chip);
    font:500 12px 'JetBrains Mono',monospace;color:var(--dim);transition:color 1.2s,border-color 1.2s,background 1.2s}
  .chip i{width:7px;height:7px;border-radius:50%;background:var(--acento);box-shadow:0 0 8px 2px var(--acento);transition:background 1.2s,box-shadow 1.2s}

  /* Selector de colección */
  .selector{position:relative;z-index:3;display:flex;justify-content:center;gap:0;margin:4px auto 0;padding:3px;border:1px solid var(--linea);border-radius:999px;background:var(--chip);
    transition:border-color 1.2s,background 1.2s}
  .selector button{border:none;background:transparent;color:var(--dim);padding:7px 18px;border-radius:999px;font:600 13px system-ui;letter-spacing:.12em;cursor:pointer;transition:color .6s,background .6s}
  .selector button.on{color:#120d06;background:var(--acento);box-shadow:0 0 14px var(--acento)}
  .selector button:disabled{cursor:wait}

  #zona{flex:1;position:relative;min-height:0}
  #stage{position:absolute;inset:0;touch-action:none}
  .escena{position:absolute;inset:0;width:100%;height:100%;display:block;transition:none}
  .escena.transicion{pointer-events:none;opacity:0;z-index:2}
  .capa{position:absolute;inset:0;transform-origin:50% 52%}

  /* Título del asistente: dos versiones que se funden */
  .titulo{position:absolute;top:18px;left:0;right:0;text-align:center;pointer-events:none;z-index:2;height:70px}
  .titulo .v{position:absolute;left:0;right:0;top:0;transition:opacity 1.8s,transform 1.8s,filter 1.8s}
  .titulo .agios h2{margin:0;font:600 34px 'Rajdhani',sans-serif;letter-spacing:.6em;padding-left:.6em;color:#ece9ff;text-shadow:0 0 18px rgba(122,111,240,.7)}
  .titulo .agios .s{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.28em;color:#7d78b8}
  .titulo .kyrien h2{margin:0;font:600 36px 'Cinzel',serif;letter-spacing:.42em;padding-left:.42em;color:#f3dca6;text-shadow:0 0 22px rgba(240,190,100,.55)}
  .titulo .kyrien .s{font:italic 500 16px 'Cormorant Garamond',serif;letter-spacing:.12em;color:#c7ad7c}
  .titulo .v.fuera{opacity:0;transform:scale(1.15);filter:blur(6px)}

  #fogonazo{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(circle at 50% 52%,rgba(255,250,235,.95),rgba(255,230,190,.5) 12%,rgba(255,200,140,.12) 35%,transparent 60%)}
  .estilos{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
  .estilos button{font:500 11px 'JetBrains Mono',monospace;padding:4px 10px;border-radius:999px;border:1px solid var(--linea);background:transparent;color:var(--dim);transition:color 1.2s,border-color 1.2s}
  .estilos button.on{color:var(--claro);border-color:var(--acento)}
  .menu{width:38px;height:34px;border-radius:9px;border:1px solid var(--linea);background:transparent;color:var(--claro);font-size:16px;transition:border-color 1.2s,color 1.2s}
  .hoja{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 56px) 12px 12px}
  .hoja.abierta{display:flex}
  .hoja-in{width:min(92vw,360px);border-radius:12px;padding:14px;border:1px solid var(--acento);background:var(--panel);color:var(--txt);box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .tema-agios{--panel:#0f0d24}.tema-kyrien{--panel:#3a2b1d}
  .hoja-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .hoja-cab b{font:600 15px system-ui;letter-spacing:.14em;text-transform:uppercase}
  .hoja-cab button{width:30px;height:28px;border-radius:6px;border:1px solid var(--linea);background:transparent;color:var(--txt)}
  .grupo{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:4px 0 8px}
  .op{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--linea);border-radius:9px;margin-bottom:8px;cursor:pointer}
  .op input{accent-color:var(--acento);margin-top:3px}
  .op b{display:block;font:600 14px system-ui}.op small{display:block;font:13px system-ui;color:var(--dim);margin-top:2px}
  .op:has(input:checked){border-color:var(--acento);box-shadow:0 0 12px rgba(150,130,255,.15)}
  /* ---------- Menú: la nebulosa ---------- */
  #cielo{position:fixed;inset:0;z-index:1;pointer-events:none;transition:opacity 1s ease}
  #cielo.oculto{opacity:0}
  .nebulosa{position:absolute;inset:0;width:100%;height:100%}
  body.tema-menu{background:#04030a}
  .tema-menu .mundo{opacity:0!important}
  body>header,body>.selector,#zona,body>.pie{position:relative;z-index:2;transition:opacity 1.2s ease}
  .tema-menu>header,.tema-menu>.selector,.tema-menu #zona,.tema-menu>.pie{opacity:0;pointer-events:none}
  #menu{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 34px) 16px calc(env(safe-area-inset-bottom) + 22px);transition:opacity 1.2s ease}
  #menu.fuera{opacity:0;pointer-events:none}
  #menu h1{margin:0;font:600 clamp(34px,9vw,58px) 'Rajdhani',sans-serif;letter-spacing:.5em;padding-left:.5em;
    background:linear-gradient(90deg,#7ff0e6,#a99bff 35%,#ff8ac0 65%,#ffb27a);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(170,150,255,.45))}
  #menu .lema{font:italic 500 17px 'Cormorant Garamond',serif;letter-spacing:.14em;color:#d8cff5;opacity:.85;margin-top:2px}
  #menu .lema2{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.3em;color:#8f86c8;margin-top:10px}
  .orbes{flex:1;position:relative;width:100%;max-width:640px}
  .orbe{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;border:none;background:none;cursor:pointer;color:#fff;padding:0}
  .orbe .bola{width:clamp(96px,24vw,140px);aspect-ratio:1;border-radius:50%;position:relative;animation:latir 4s ease-in-out infinite}
  .orbe .bola::before,.orbe .bola::after{content:'';position:absolute;inset:-14%;border-radius:50%;border:1px solid currentColor;opacity:.45;animation:girar 14s linear infinite}
  .orbe .bola::after{inset:-26%;border-style:dashed;opacity:.25;animation-duration:26s;animation-direction:reverse}
  .orbe.agios{left:32%;top:36%;color:#8f86ff}
  .orbe.agios .bola{background:radial-gradient(circle at 50% 50%,#fff 0%,#c9c2ff 8%,#7a6ff0 26%,rgba(80,110,240,.45) 48%,rgba(60,40,160,0) 70%);box-shadow:0 0 60px 10px rgba(122,111,240,.45)}
  .orbe.kyrien{left:68%;top:64%;color:#f0b04a}
  .orbe.kyrien .bola{background:radial-gradient(circle at 50% 50%,#fff 0%,#ffe3b0 8%,#ff9a3c 26%,rgba(220,110,40,.45) 48%,rgba(160,60,20,0) 70%);box-shadow:0 0 60px 10px rgba(255,150,60,.42);animation-delay:-2s}
  .orbe b{font:600 20px 'Rajdhani',sans-serif;letter-spacing:.42em;padding-left:.42em;text-shadow:0 0 14px currentColor}
  .orbe.kyrien b{font-family:'Cinzel',serif;letter-spacing:.3em}
  .orbe small{font:italic 500 15px 'Cormorant Garamond',serif;color:#e6def7;letter-spacing:.06em;margin-top:-6px}
  @keyframes latir{50%{transform:scale(1.06);filter:brightness(1.15)}}
  @keyframes girar{to{transform:rotate(360deg)}}
  .inicio{border:none;background:none;padding:0;text-align:left;cursor:pointer;color:inherit}
  .pie{position:relative;z-index:3;padding:10px 14px calc(14px + env(safe-area-inset-bottom));text-align:center;font:500 12px 'JetBrains Mono',monospace;color:var(--dim);transition:color 1.2s}
  @media (max-width:520px){.titulo .agios h2{font-size:28px}.titulo .kyrien h2{font-size:29px}}
</style>
</head>
<body class="tema-menu">
<div id="cielo"></div>
<div id="menu">
  <h1>ANESTHIOS</h1>
  <div class="lema">Asistentes Gonzaleanos</div>
  <div class="orbes">
    <button class="orbe agios" type="button" data-col="agios"><span class="bola"></span><b>AGIOS</b><small>Lecturas y Evangelios</small></button>
    <button class="orbe kyrien" type="button" data-col="kyrien"><span class="bola"></span><b>KYRIEN</b><small>Doctrina Gonzaleana</small></button>
  </div>
  <div class="lema2">ELIGE UN ASISTENTE</div>
</div>
<div class="mundo agios"></div><div class="mundo kyrien"></div>

<header>
  <button class="marca inicio" id="aInicio" type="button" title="Volver al inicio">
    <div class="v agios">ANESTHIOS<small>ASISTENTES GONZALEANOS</small></div>
    <div class="v kyrien">ANESTHIOS<small>Asistentes Gonzaleanos</small></div>
  </button>
  <div class="chip"><i></i><span id="estado">activo</span></div>
  <button class="menu" id="btnMenu" type="button" title="Menú">☰</button>
</header>
<div class="hoja" id="hoja">
  <div class="hoja-in">
    <div class="hoja-cab"><b>Ajustes</b><button type="button" id="cerrarHoja">✕</button></div>
    <div class="grupo">Transición entre asistentes</div>
    <label class="op"><input type="radio" name="trans" value="implosion"><span><b>Implosión</b><small>Se absorbe hacia su centro, destella y renace de una galaxia espiral</small></span></label>
    <label class="op"><input type="radio" name="trans" value="estallido"><span><b>Estallido</b><small>Estalla en partículas que se transforman en el otro asistente</small></span></label>
    <label class="op"><input type="radio" name="trans" value="azar"><span><b>Al azar</b><small>Cada cambio usa una de las dos</small></span></label>
  </div>
</div>
<div class="selector" id="selector">
  <button type="button" data-col="agios" class="on">AGIOS</button>
  <button type="button" data-col="kyrien">KYRIEN</button>
</div>

<div id="zona">
  <div class="titulo">
    <div class="v agios" id="tAgios"><h2>AGIOS</h2><div class="s">LECTURAS Y EVANGELIOS</div></div>
    <div class="v kyrien fuera" id="tKyrien"><h2>KYRIEN</h2><div class="s">✦ Doctrina Gonzaleana ✦</div></div>
  </div>
  <div id="fogonazo"></div>
  <div id="stage">
    <div class="capa" id="capaAgios" style="opacity:0"></div>
    <div class="capa" id="capaKyrien" style="opacity:0"></div>
  </div>
</div>
<div class="pie" id="pie">Toca ANESTHIOS para volver al inicio · AGIOS | KYRIEN para cambiar de asistente · ☰ Ajustes</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import escenaAgios from './agios-escena.js';
import escenaKyrien from './kyrien-escena.js';
import {crearTransicion} from './transicion.js';
import {crearNebulosa} from './nebulosa.js';

const $=id=>document.getElementById(id);
const nuevoS=()=>({energy:1,mult:1,apertura:0,temblor:0,destello:{color:new THREE.Color(),k:0,h:0},particles:90,rot:0,rotVel:0,tilt:0,zoom:1,T:0});
const M={
  agios:{S:nuevoS(),capa:$('capaAgios'),titulo:$('tAgios')},
  kyrien:{S:nuevoS(),capa:$('capaKyrien'),titulo:$('tKyrien')},
};
M.agios.esc=escenaAgios.crear(M.agios.capa,M.agios.S);
M.kyrien.esc=escenaKyrien.crear(M.kyrien.capa,M.kyrien.S);
const trans=crearTransicion($('stage'));
const neb=crearNebulosa($('cielo'));
function layout(){const r=$('stage').getBoundingClientRect();if(!r.width)return;for(const k in M)M[k].esc.redimensionar(r.width,r.height);trans.redimensionar(r.width,r.height);
  neb.redimensionar(innerWidth,innerHeight);neb.encuadre(r);}
addEventListener('resize',layout);
new ResizeObserver(layout).observe($('stage'));layout();

let enMenu=true,viaje=null;          // viaje: {tipo:'entrar'|'volver', col}
let actual='agios',siguiente=null,tTrans=0,modo='implosion',DURA=7000;
const DURACION={implosion:7000,estallido:6000};
/* Ajustes: estilo de transición (se guarda en el dispositivo) */
let preferencia='implosion';
try{preferencia=localStorage.getItem('anesthios.transicion')||'implosion';}catch{}
document.querySelectorAll('input[name=trans]').forEach(r=>{r.checked=r.value===preferencia;
  r.onchange=()=>{preferencia=r.value;try{localStorage.setItem('anesthios.transicion',preferencia);}catch{}};});
$('btnMenu').onclick=()=>$('hoja').classList.add('abierta');
$('cerrarHoja').onclick=()=>$('hoja').classList.remove('abierta');
$('hoja').onclick=e=>{if(e.target.id==='hoja')$('hoja').classList.remove('abierta');};
const suave=x=>x*x*(3-2*x),lim=x=>Math.max(0,Math.min(1,x));

function cambiar(a){
  if(a===actual||siguiente||enMenu||viaje)return;
  siguiente=a;tTrans=0;
  document.querySelectorAll('#selector button').forEach(b=>{b.disabled=true;});
  $('estado').textContent='transformando…';
  const llega=M[a];llega.S.apertura=1;llega.S.rot=M[actual].S.rot;                // el que llega empieza deshecho
  modo=preferencia==='azar'?(Math.random()<0.5?'implosion':'estallido'):preferencia;
  DURA=DURACION[modo];trans.correr(actual,a,DURA,modo);
}
document.querySelectorAll('#selector button').forEach(b=>b.onclick=()=>cambiar(b.dataset.col));

/* Coreografía: el que se va se deshace y se apaga; el tema cambia a la mitad; el que llega se arma */
function coreografia(dT){
  if(!siguiente)return;
  tTrans+=dT;const p=lim(tTrans/DURA);
  const va=M[actual],llega=M[siguiente];
  // el que se va
  if(modo==='implosion'){
    // es absorbido: gira más rápido, se encoge hacia su centro y se apaga
    va.S.mult=1+3*suave(lim(p/0.15));const enc=suave(lim(p/0.17));
    va.capa.style.opacity=1-suave(lim((p-0.06)/0.11));va.capa.style.transform=`scale(${1-0.85*enc}) rotate(${enc*40}deg)`;
    const f=Math.exp(-Math.pow((p-0.18)/0.04,2));$('fogonazo').style.opacity=f;
  }else{
    va.S.apertura=Math.max(va.S.apertura,suave(lim(p/0.18)));va.S.mult=1+2*suave(lim(p/0.15));
    va.capa.style.opacity=1-suave(lim((p-0.05)/0.2));
    va.capa.style.transform=actual==='agios'?`scale(${1+0.35*suave(lim(p/0.25))})`:`scale(${1+0.15*suave(lim(p/0.25))})`;
  }
  // a la mitad: cambia el mundo (fondo, colores, títulos, selector)
  if(p>(modo==='implosion'?0.36:0.42)&&document.body.classList.contains('tema-'+actual)){
    document.body.className='tema-'+siguiente;
    va.titulo.classList.add('fuera');llega.titulo.classList.remove('fuera');
    document.querySelectorAll('#selector button').forEach(b=>b.classList.toggle('on',b.dataset.col===siguiente));
  }
  // el que llega: aparece mientras las partículas lo dibujan y se termina de armar
  const ini=modo==='implosion'?0.74:0.68;
  const fl=suave(lim((p-ini)/0.2));llega.capa.style.opacity=fl;llega.capa.style.transform=`scale(${0.92+0.08*fl})`;
  llega.S.apertura=1-suave(lim((p-ini+0.02)/(0.98-ini)));llega.S.mult=1;
  if(p>=1){
    va.capa.style.opacity=0;va.S.apertura=0;va.S.mult=1;va.capa.style.transform='';$('fogonazo').style.opacity=0;
    llega.capa.style.transform='';actual=siguiente;siguiente=null;
    document.querySelectorAll('#selector button').forEach(b=>b.disabled=false);$('estado').textContent='activo';
  }
}

/* ---------- Menú nebulosa: entrar a un asistente y volver ---------- */
function entrar(col){
  if(viaje||!enMenu)return;
  actual=col;viaje={tipo:'entrar',col,cambioTema:false};
  $('menu').classList.add('fuera');
  const m=M[col];m.S.apertura=1;m.S.rot=0;m.S.tilt=0;m.S.rotVel=0;
  M[col].titulo.classList.remove('fuera');M[col==='agios'?'kyrien':'agios'].titulo.classList.add('fuera');
  document.querySelectorAll('#selector button').forEach(b=>b.classList.toggle('on',b.dataset.col===col));
  layout();neb.formar(col,5200);
}
function volver(){
  if(viaje||enMenu||siguiente)return;
  viaje={tipo:'volver',col:actual,cambioTema:false};enMenu=true;
  $('cielo').classList.remove('oculto');layout();neb.disolver(actual,4800);
}
document.querySelectorAll('.orbe').forEach(o=>o.onclick=()=>entrar(o.dataset.col));
$('aInicio').onclick=volver;
function coreografiaMenu(){
  if(!viaje)return;
  const p=neb.progreso,m=M[viaje.col];
  if(viaje.tipo==='entrar'){
    if(p>0.42&&!viaje.cambioTema){viaje.cambioTema=true;document.body.className='tema-'+viaje.col;}   // aparece su mundo
    const fl=suave(lim((p-0.66)/0.26));m.capa.style.opacity=fl;m.capa.style.transform=`scale(${0.94+0.06*fl})`;
    m.S.apertura=1-suave(lim((p-0.62)/0.38));                                   // Kyrien rearma su roca; Agios cierra su núcleo
  }else{
    const fv=1-suave(lim(p/0.2));m.capa.style.opacity=fv;m.S.apertura=suave(lim(p/0.15));m.S.mult=1+2*suave(lim(p/0.15));
    if(p>0.3&&!viaje.cambioTema){viaje.cambioTema=true;document.body.className='tema-menu';}
    if(p>0.62)$('menu').classList.remove('fuera');
  }
}
function finViaje(fin){
  const m=M[viaje.col];
  if(viaje.tipo==='entrar'){m.capa.style.opacity=1;m.capa.style.transform='';m.S.apertura=0;enMenu=false;$('cielo').classList.add('oculto');}
  else{m.capa.style.opacity=0;m.S.apertura=0;m.S.mult=1;}
  viaje=null;
}

/* Gestos: arrastrar para girar al asistente visible */
let down=null;
$('stage').addEventListener('pointerdown',e=>{$('stage').setPointerCapture(e.pointerId);down={x:e.clientX,y:e.clientY};});
$('stage').addEventListener('pointermove',e=>{if(!down)return;const S=M[actual].S,dx=e.clientX-down.x,dy=e.clientY-down.y;down={x:e.clientX,y:e.clientY};
  S.rot+=dx*0.008;S.rotVel=dx*0.008;S.tilt=Math.max(-.3,Math.min(.7,S.tilt+dy*.004));});
$('stage').addEventListener('pointerup',()=>down=null);$('stage').addEventListener('pointercancel',()=>down=null);

let last=performance.now();
function loop(t){
  const dT=Math.min(50,Math.max(0,t-last));last=t;
  coreografia(dT);coreografiaMenu();
  for(const k in M){
    const m=M[k],S=m.S,visible=(k===actual&&(!enMenu||!!viaje))||k===siguiente;
    S.T+=dT*0.85*S.mult;if(!down||k!==actual){S.rot+=S.rotVel;S.rotVel*=Math.pow(.94,dT/16.7);}
    if(visible)m.esc.dibujar(t,dT);                     // el oculto no gasta GPU
  }
  trans.dibujar(dT,M[actual].S.rot);
  const cieloVisible=enMenu||viaje||!$('cielo').classList.contains('oculto');
  if(cieloVisible&&(enMenu||viaje)){const fin=neb.dibujar(dT);if(fin&&viaje)finViaje(fin);}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
