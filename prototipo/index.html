<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07070d">
<title>Agios – prototipo</title>
<style>
  :root{--bg:#07070d;--txt:#CECBF6;--dim:#7d78b8;--line:#2c2766;--acc:#7a6ff0;--glass:rgba(16,14,40,.82)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 0}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.12em}
  h1 small{font-size:11px;font-weight:400;letter-spacing:0;color:var(--dim);margin-left:6px}
  #estado{font:12px ui-monospace,monospace;color:var(--dim);transition:color .4s}
  #zona{flex:1;position:relative;min-height:0}
  #stage{position:absolute;inset:0;touch-action:none}
  .escena{position:absolute;inset:0;width:100%;height:100%;display:block}
  #capa{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:var(--dim);transition:opacity .6s;pointer-events:none}

  /* Ventana "Subir archivo" que sale del núcleo */
  #subir{position:absolute;width:min(78vw,300px);padding:18px;border-radius:16px;background:var(--glass);border:1px solid var(--acc);
    box-shadow:0 0 40px rgba(122,111,240,.35);text-align:center;transform:translate(-50%,-50%) scale(0);opacity:0;
    transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .35s;pointer-events:none;backdrop-filter:blur(6px)}
  #subir.abierta{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  #subir h2{font-size:16px;margin:0 0 6px;font-weight:600}
  #subir p{font-size:12px;color:var(--dim);margin:0 0 14px}
  #subir .fila{display:flex;gap:8px}

  /* Ventanas de resultados que nacen de partículas de los anillos */
  #resultados{position:absolute;inset:0;padding:10px 12px 46px;display:flex;flex-direction:column;gap:10px;justify-content:flex-start;align-items:stretch;overflow-y:auto;pointer-events:none}
  .tarjeta{pointer-events:auto;width:min(86%,340px);padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid #534AB7;
    box-shadow:0 0 24px rgba(122,111,240,.25);backdrop-filter:blur(6px);transform:scale(.02);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.3,1.15),opacity .3s}
  .tarjeta:nth-child(even){align-self:flex-end}
  .tarjeta.visible{transform:scale(1);opacity:1}
  .tarjeta .ref{font:600 13px ui-monospace,monospace;color:#b9b2ff}
  .tarjeta .tipo{font-size:11px;color:var(--dim);margin-left:6px}
  .tarjeta p{font-size:13px;line-height:1.45;margin:6px 0 8px;color:var(--txt)}
  .tarjeta .acciones{display:flex;gap:8px;justify-content:flex-end}
  .chispa{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#e9e6ff;
    box-shadow:0 0 10px 4px rgba(150,130,255,.9),0 0 24px 8px rgba(110,90,240,.5);pointer-events:none}

  /* Lector a pantalla completa */
  #lector{position:fixed;inset:0;background:rgba(7,7,13,.94);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 18px 18px;z-index:5}
  #lector.abierto{display:flex}
  #lector header{padding:0 0 10px;border-bottom:1px solid var(--line)}
  #lector article{overflow-y:auto;padding-top:12px;font-size:15px;line-height:1.6}

  .barra{padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid var(--line);background:#0a0a14}
  .barra input{flex:1;min-width:0;background:#0f0d24;border:1px solid #3a3480;border-radius:12px;color:var(--txt);padding:11px 12px;font-size:15px;outline:none}
  .barra input:focus{border-color:var(--acc)}
  .barra input:disabled{opacity:.45}
  button{background:transparent;color:var(--txt);border:1px solid #534AB7;border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
  button:active{background:#17143a}
  button:disabled{opacity:.4}
  button.prim{background:#1d1950;border-color:var(--acc)}
  .icono{width:46px;flex:none;font-size:18px;padding:0}
  .demo{display:flex;gap:6px;justify-content:center;padding:0 12px 6px}
  .demo button{font-size:11px;padding:5px 8px;color:var(--dim);border-color:var(--line)}
</style>
</head>
<body>
<header>
  <h1>AGIOS<small>Lecturas y Evangelios</small></h1>
  <span id="estado">apagado</span>
</header>

<div id="zona">
  <div id="stage"></div>
  <div id="capa">
    <div id="resultados"></div>
    <div id="subir">
      <h2>Subir archivo</h2>
      <p>Elige el .docx de Lecturas y Evangelios Gonzaleanos</p>
      <div class="fila">
        <button id="cancelarSubir" type="button" style="flex:1">Cancelar</button>
        <button id="elegir" class="prim" type="button" style="flex:1.4">Elegir archivo</button>
      </div>
      <input id="archivo" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    </div>
  </div>
  <div id="hint">Toca a Agios para encenderlo</div>
</div>

<div class="demo">
  <span style="font-size:11px;color:var(--dim);align-self:center">Prototipo:</span>
  <button id="demoOk" type="button">Simular carga correcta</button>
  <button id="demoErr" type="button">Simular error</button>
</div>
<form class="barra" id="form">
  <button id="btnSubir" class="icono" type="button" title="Subir archivo" disabled>📎</button>
  <input id="consulta" placeholder="Toca a Agios para encenderlo" autocomplete="off" disabled>
  <button id="btnBuscar" class="icono prim" type="submit" title="Buscar" disabled>➤</button>
</form>

<div id="lector">
  <header style="display:flex;justify-content:space-between;align-items:center">
    <span id="lectorTitulo" style="font:600 14px ui-monospace,monospace;color:#b9b2ff"></span>
    <button id="cerrarLector" type="button">Cerrar</button>
  </header>
  <article id="lectorTexto"></article>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import escenaAgios from './agios-escena.js';

/* ---------- Estado visual compartido con la escena ---------- */
const S={energy:0,mult:1,apertura:0,temblor:0,destello:{color:new THREE.Color(),k:0},
         particles:90,rot:0,rotVel:0,tilt:0,zoom:1,T:0};
const meta={energy:0,mult:1,apertura:0,temblor:0};   // hacia dónde se mueven suavemente

const $=id=>document.getElementById(id);
const stage=$('stage'),zona=$('zona');
const escena=escenaAgios.crear(stage,S);
function layout(){const r=stage.getBoundingClientRect();if(r.width&&r.height)escena.redimensionar(r.width,r.height);}
new ResizeObserver(layout).observe(stage);layout();

/* ---------- Máquina de estados de Agios ---------- */
let modo='apagado';
const etiquetas={apagado:'apagado',activo:'activo',esperando:'esperando archivo',procesando:'procesando…',
                 exito:'archivo listo',error:'no se pudo procesar',buscando:'buscando…'};
function poner(m,texto){
  modo=m;$('estado').textContent=texto||etiquetas[m];
  const on=m!=='apagado';
  meta.energy=on?1:0;
  meta.mult={procesando:3,buscando:2}[m]||1;
  meta.apertura=m==='esperando'?1:0;
  meta.temblor=m==='procesando'?1:0;
  clearTimeout(poner.t);if(m==='esperando')poner.t=setTimeout(()=>$('subir').classList.add('abierta'),380);else $('subir').classList.remove('abierta');
  const libre=m==='activo';
  $('consulta').disabled=$('btnSubir').disabled=$('btnBuscar').disabled=!libre;
  $('consulta').placeholder=on?'Pídele a Agios una lectura, un evangelio o una idea…':'Toca a Agios para encenderlo';
  $('hint').textContent=on?'':'Toca a Agios para encenderlo';
}
function destellar(hex){S.destello.color.set(hex);S.destello.k=1;S.destello.h=900;}

/* Encender / apagar con un toque sobre Agios */
function alternar(){
  if(modo==='apagado'){poner('activo');}
  else if(modo==='activo'){limpiarResultados();poner('apagado');}
}

/* ---------- Subir archivo ---------- */
$('btnSubir').onclick=()=>{limpiarResultados();colocarVentana();poner('esperando');};
$('cancelarSubir').onclick=()=>poner('activo');
$('elegir').onclick=()=>$('archivo').click();
$('archivo').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)procesar(f.name,/\.docx$/i.test(f.name));};
$('demoOk').onclick=()=>{if(modo==='activo'||modo==='esperando')procesar('Lecturas y Evangelios.docx',true);};
$('demoErr').onclick=()=>{if(modo==='activo'||modo==='esperando')procesar('foto.jpg',false);};
function colocarVentana(){const c=escena.proyectar(new THREE.Vector3(0,0,0));const v=$('subir');v.style.left=c.x+'px';v.style.top=(c.y+Math.min(170,zona.clientHeight*0.27))+'px';}

function procesar(nombre,valido){
  poner('procesando');           // la ventana se retrae y el núcleo se cierra
  setTimeout(()=>{
    if(valido){destellar('#3ddc84');poner('exito');}
    else{destellar('#ff4d5e');poner('error','archivo no válido');}
    setTimeout(()=>poner('activo'),1800);
  },3600);                                               // (simulado: aquí iría el procesamiento real)
}

/* ---------- Buscar y mostrar ---------- */
const EJEMPLOS=[
  {ref:'Lect. Gonz. 12',tipo:'Santa Lectura'},
  {ref:'Evang. Gonz. 12',tipo:'Santo Evangelio'},
  {ref:'Salmo Gonz. 87',tipo:'Santo Salmo'},
  {ref:'Evang. Gonz. 145',tipo:'Santo Evangelio'},
];
const TEXTO='Texto de ejemplo. En la app real aquí aparecerá el pasaje exacto de tu documento, con su número y su ubicación.';
$('form').onsubmit=e=>{
  e.preventDefault();const q=$('consulta').value.trim();if(!q||modo!=='activo')return;
  limpiarResultados();poner('buscando');
  setTimeout(()=>{
    const num=q.match(/\d+/);
    let res=num?[{ref:`Lect. Gonz. ${num[0]}`,tipo:'Santa Lectura'},{ref:`Evang. Gonz. ${num[0]}`,tipo:'Santo Evangelio'}]
               :EJEMPLOS.slice(0,2+Math.floor(Math.random()*2));
    poner('activo',res.length+' resultados');
    mostrar(res);
  },1700);                                               // (simulado: aquí iría la búsqueda real)
};

function limpiarResultados(){$('resultados').innerHTML='';}
function mostrar(lista){
  const cont=$('resultados'),zr=zona.getBoundingClientRect();
  lista.forEach((r,i)=>{
    const t=document.createElement('div');t.className='tarjeta';
    t.innerHTML=`<span class="ref">${r.ref}</span><span class="tipo">${r.tipo}</span><p>${TEXTO}</p>
      <div class="acciones"><button type="button">Ver completo</button></div>`;
    t.querySelector('button').onclick=()=>abrirLector(r);
    cont.append(t);
    // Una partícula se desprende de un anillo y viaja hasta donde nacerá la ventana
    setTimeout(()=>{
      const o=escena.puntoDeAnillo(i,S.T*0.001+i*2.1);
      const d=t.getBoundingClientRect();
      const dx=d.left-zr.left+d.width/2,dy=d.top-zr.top+d.height/2;
      t.style.transformOrigin='50% 50%';
      const ch=document.createElement('div');ch.className='chispa';$('capa').append(ch);
      ch.animate([{left:o.x+'px',top:o.y+'px',transform:'scale(1)'},
                  {left:(o.x+dx)/2+(i%2?40:-40)+'px',top:(o.y+dy)/2-30+'px',transform:'scale(1.4)',offset:.55},
                  {left:dx+'px',top:dy+'px',transform:'scale(2.2)'}],
                 {duration:700,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'})
        .onfinish=()=>{ch.remove();t.classList.add('visible');};
    },i*260);
  });
}
function abrirLector(r){$('lectorTitulo').textContent=r.ref+' · '+r.tipo;$('lectorTexto').textContent=TEXTO+' '+TEXTO+' '+TEXTO;$('lector').classList.add('abierto');}
$('cerrarLector').onclick=()=>$('lector').classList.remove('abierto');

/* ---------- Gestos: tocar = encender/apagar, arrastrar = girar, pellizcar = zoom ---------- */
const ptrs=new Map();let down=null,pinch0=null;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)down={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:S.zoom};if(down)down.moved=true;}});
stage.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2&&pinch0){const [a,b]=[...ptrs.values()];S.zoom=Math.max(0.5,Math.min(2.5,pinch0.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d));return;}
  if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)down.moved=true;
  if(down&&down.moved){S.rot+=dx*0.008;S.rotVel=dx*0.008;S.tilt=Math.max(-0.3,Math.min(0.7,S.tilt+dy*0.004));}});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;
  if(ptrs.size===0&&down){if(!down.moved&&performance.now()-down.t<300)alternar();down=null;}}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();S.zoom=Math.max(0.5,Math.min(2.5,S.zoom*Math.exp(-e.deltaY*0.001)));},{passive:false});

/* ---------- Bucle ---------- */
let last=performance.now();
const suave=(a,b,dT,k)=>a+(b-a)*(1-Math.pow(k,dT/16.7));
function loop(t){
  const dT=Math.min(50,Math.max(0,t-last));last=t;
  S.energy=suave(S.energy,meta.energy,dT,0.95);
  S.mult=suave(S.mult,meta.mult,dT,0.93);
  S.apertura=suave(S.apertura,meta.apertura,dT,0.9);
  S.temblor=suave(S.temblor,meta.temblor,dT,0.9);
  S.destello.h=Math.max(0,(S.destello.h||0)-dT);if(S.destello.h<=0)S.destello.k=Math.max(0,S.destello.k-dT/900);
  S.T+=dT*0.85*S.mult*(0.15+0.85*S.energy);
  if(!down){S.rot+=S.rotVel;S.rotVel*=Math.pow(0.94,dT/16.7);}
  if(modo==='esperando')colocarVentana();
  escena.dibujar(t,dT);requestAnimationFrame(loop);
}
poner('apagado');requestAnimationFrame(loop);
</script>
</body>
</html>
